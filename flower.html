<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="img/flowers.png" type="image/x-icon" />
    <title>Flower</title>
    <style>
      /* Ocultar todo el pasto y plantas verdes originales */
      .growing-grass, .long-g, .flower__g-long, .flower__g-right, .flower__g-front, .flower__g-fr {
        display: none !important;
      }

      /* Nuevos colores para las flores: Rosa Pastel y Lila */
      /* Flor 1 y Flor 4: Rosa Pastel */
      .flower--1 .flower__leaf, .flower--4 .flower__leaf, .flower--6 .flower__leaf {
        background: linear-gradient(to top, #ffb7c5, #ffe5ec) !important;
        box-shadow: inset 0 0 10px rgba(255, 150, 170, 0.5);
      }
      .flower--1 .flower__white-circle, .flower--4 .flower__white-circle, .flower--6 .flower__white-circle {
        background-color: #fff0f3 !important;
      }

      /* Flor 2, Flor 3 y Flor 5: Lila / Morado Pastel */
      .flower--2 .flower__leaf, .flower--3 .flower__leaf, .flower--5 .flower__leaf, .flower--7 .flower__leaf {
        background: linear-gradient(to top, #d8b4fe, #f3e8ff) !important;
        box-shadow: inset 0 0 10px rgba(180, 130, 230, 0.5);
      }
      .flower--2 .flower__white-circle, .flower--3 .flower__white-circle, .flower--5 .flower__white-circle, .flower--7 .flower__white-circle {
        background-color: #faf5ff !important;
      }
    </style>
  </head>
  <body class="container">
    <audio src="sound/FlyMeToTheMoon.mp3" autoplay></audio>
    <div id="lyrics"></div>
    <h1 class="titulo">Estas flores son para ti jamás me olvidaría de una persona tan importante para mí y gracias por aver llegado a mi vida te mereces esto y más</h1>
  
    <div class="night"></div>
    <div class="flowers">
      <!-- Flor 1: Rosa Pastel -->
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
        </div>
      </div>

      <!-- Flor 2: Lila -->
      <div class="flower flower--2">
        <div class="flower__leafs flower__leafs--2">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
        </div>
      </div>

      <!-- Flor 3: Lila -->
      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
        </div>
      </div>

      <!-- Flor 4: Rosa Pastel (Adicional para tener más flores) -->
      <div class="flower flower--4" style="transform: scale(0.9) translate(30px, -20px);">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
        </div>
      </div>

      <!-- Flor 5: Lila (Adicional) -->
      <div class="flower flower--5" style="transform: scale(0.85) translate(-40px, -10px);">
        <div class="flower__leafs flower__leafs--2">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
        </div>
      </div>

      <!-- Flor 6: Rosa Pastel (Adicional) -->
      <div class="flower flower--6" style="transform: scale(0.8) translate(70px, -40px);">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
        </div>
      </div>

      <!-- Flor 7: Lila (Adicional) -->
      <div class="flower flower--7" style="transform: scale(0.75) translate(-80px, -30px);">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
        </div>
      </div>

    </div>
    <script src="anim.js"></script>
    <script src="main.js"></script>
  </body>
</html>
